events { worker_connections 1024; }

http {
    # Log format for micro service tracing
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream: $upstream_addr';
    
    access_log /var/log/nginx/access.log main;

    server {
        listen 80;
        server_name _;

        # Docker's internal DNS resolver with 10-second cache
        resolver 127.0.0.11 valid=10s;

        # Route 1: Auth Service (REST)
        location /api/v1/auth/ {
            proxy_pass http://auth:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route 2: Task Service (GraphQL)
        location /api/v1/graphql/ {
            proxy_pass http://task:8080;
               proxy_set_header Host $host;
               proxy_set_header X-Real-IP $remote_addr;
        }

        # Route 3: Notification Service (WebSockets)
        location /api/v1/notifications/wb {
            proxy_pass http://notification:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }
    }
}