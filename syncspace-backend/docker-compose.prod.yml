services:
  postgres:
    image: postgres:16-alpine
    container_name: syncspace_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - syncspace-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d {POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:4.4.18
    container_name: syncspace_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_DB}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - syncspace-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: syncspace_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - syncspace-network

  gateway:
    image: nginx:1.25-alpine
    container_name: syncspace_gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - syncspace-network

  auth:
    image: ghcr.io/sanjeevsaju/syncspace/syncspace-auth-service:latest
    container_name: syncspace_auth
    restart: always
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - syncspace-network

  profile:
    image: ghcr.io/sanjeevsaju/syncspace/syncspace-profile-service:latest
    container_name: syncspace_profile
    restart: always
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/profile_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - syncspace-network

  task:
    image: ghcr.io/sanjeevsaju/syncspace/syncspace-task-service:latest
    container_name: syncspace_task
    restart: always
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017
      PROFILE_SERVICE_HOST: profile
      PROFILE_SERVICE_PORT: 50051
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD}
    depends_on:
      - mongodb
      - profile
      - rabbitmq
    networks:
      - syncspace-network

  notification:
    image: ghcr.io/sanjeevsaju/syncspace/syncspace-notification-service:latest
    container_name: syncspace_notification
    restart: always
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD}
    depends_on:
      - rabbitmq
    networks:
      - syncspace-network

networks:
  syncspace-network:
    driver: bridge

volumes:
  pg_data:
  mongo_data:
  rabbitmq_data: