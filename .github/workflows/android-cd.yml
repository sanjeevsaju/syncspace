name: Android CD

on:
  push:
    branches:
      - main
    paths:
      - "syncspace-android/**"
      - ".github/workflows/android-cd.yml"

jobs:
  deploy:
    name: Build and release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: syncspace-android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
          app/build/outputs/apk/release/syncspace-${{ github.run_number }}.apk

      - name: Create Github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: "Android Build ${{ github.run_number }}"
          files: syncspace-android/app/build/outputs/apk/release/syncspace-*.apk
          generate-release-notes: true