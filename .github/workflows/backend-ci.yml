name: Backend CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "syncspace-backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "syncspace-backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  lint:
    name: Lint / Format check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - syncspace-auth-service
          - syncspace-notification-service
          - syncspace-profile-service
          - syncspace-task-service
    defaults:
      run:
        working-directory: syncspace-backend/${{matrix.service}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run ktlint check (Kotlin services)
        run: ./gradlew ktlintCheck

  unit-tests:
    name: Unit tests
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - syncspace-auth-service
          - syncspace-notification-service
          - syncspace-profile-service
          - syncspace-task-service
    defaults:
      run:
        working-directory: syncspace-backend/${{matrix.service}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run ktlint check (Kotlin services)
        run: ./gradlew test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.service }}
          path: 'syncspace-backend/${{ matrix.service }}/**/build/test-results/**/*.xml'