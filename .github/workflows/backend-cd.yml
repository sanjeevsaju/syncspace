name: Backend CD

on:
  push:
    branches:
      - main
    paths:
      - "syncspace-backend/**"
      - ".github/workflows/backend-cd.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  detect-changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
      deploy_needed: ${{ steps.filter.outputs.deploy_needed }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Path Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            syncspace-auth-service:
              - 'syncspace-backend/syncspace-auth-service/**'
            syncspace-notification-service:
              - 'syncspace-backend/syncspace-notification-service/**'
            syncspace-profile-service:
              - 'syncspace-backend/syncspace-profile-service/**'
            syncspace-task-service:
              - 'syncspace-backend/syncspace-task-service/**'
            deploy_needed:
              - 'syncspace-backend/**'
              - '.github/workflows/backend-cd.yml'

  build-and-push:
    name: Build and Push ${{ matrix.service }}
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    defaults:
      run:
        working-directory: syncspace-backend/${{ matrix.service }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permissions for gradlew
        run: chmod +x gradlew

      - name: Build JAR (skip test, CI already ran them)
        run: ./gradlew build -x test

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: syncspace-backend/${{ matrix.service }}
          platforms: linux/amd64, linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}

  deploy:
    name: Deploy to GCP VM
    needs: [detect-changes, build-and-push]
    if: always() && needs.detect-changes.outputs.deploy_needed == 'true' && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/syncspace/syncspace-backend
            git pull origin main
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            sleep 15
            curl -f http://localhost/api/v1/auth/health || (echo "Health Check failed" && exit 1)